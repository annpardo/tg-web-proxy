name: docker-image

# 唯一的部署文件：在 GitHub Actions 里构建镜像并推送到 GHCR。
# 仓库里有 Dockerfile 就用它；没有就在 CI 的工作目录里生成一个最小可用的
# （不会写回仓库），所以除本文件外不需要改动任何文件。
#
# 产出：ghcr.io/<owner>/<repo>:latest、:sha-<短哈希>；推 v* 标签会多一个版本 tag。

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check sources
        run: |
          for f in mtprotoproxy.py webproxy.py config.py; do
            if [ ! -f "$f" ]; then
              echo "::error::仓库根目录缺少 $f"
              exit 1
            fi
          done

      # 有 Dockerfile 就用；没有就生成一个最小可用的。
      - name: Choose Dockerfile
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            file=Dockerfile
            echo "使用仓库里的 Dockerfile"
          else
            file=Dockerfile.ci
            printf '%s\n' \
              'FROM python:3.12-slim' \
              'ENV PYTHONUNBUFFERED=1' \
              'WORKDIR /app' \
              'RUN pip install --no-cache-dir cryptography' \
              'COPY mtprotoproxy.py webproxy.py config.py ./' \
              'EXPOSE 443' \
              'CMD ["python", "mtprotoproxy.py"]' > "$file"
            echo "仓库没有 Dockerfile，已生成最小 Dockerfile"
          fi
          echo "path=$file" >> "$GITHUB_OUTPUT"
          echo "--- $file ---"
          cat "$file"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
